<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Botões com Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>

  <div class="container my-5">
    <h2 class="mb-4 text-center">Botões com Bootstrap</h2>

    <div class="mb-4 d-flex flex-wrap gap-2 justify-content-center">
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <button class="btn btn-danger">Danger</button>
      <button class="btn btn-warning">Warning</button>
      <button class="btn btn-info">Info</button>
      <button class="btn btn-light">Light</button>
      <button class="btn btn-dark">Dark</button>
    </div>

    <div class="mb-4 text-center">
      <button class="btn btn-outline-primary">
        <i class="fas fa-download me-2"></i>Baixar
      </button>
    </div>

    <div class="text-center d-flex flex-column align-items-center gap-2">
      <button class="btn btn-success btn-lg">Botão Grande</button>
      <button class="btn btn-success">Botão Médio (padrão)</button>
      <button class="btn btn-success btn-sm">Botão Pequeno</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://kit.fontawesome.com/eafada59b6.js" crossorigin="anonymous"></script>
</body>
</html>
