<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layout Responsivo com Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <h1 class="text-center mb-4">Layout Responsivo com 3 Colunas</h1>
    
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-primary text-white text-center rounded">Coluna 1</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-success text-white text-center rounded">Coluna 2</div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="p-3 bg-danger text-white text-center rounded">Coluna 3</div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
